name: Publish to PyPI

# Trusted Publishing: no API token. On PyPI, add a "pending publisher" for
# owner SuperAngryMonkey, repo kairos, workflow publish.yml, environment pypi.
# Then push a tag like v0.1.0 (or create a GitHub release) to publish.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build
      - name: Smoke-test the wheel in a clean venv
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          /tmp/smoke/bin/kairos-mcp --version
          /tmp/smoke/bin/python -c "import server; print(len([t for t in dir(server) if not t.startswith('_')]), 'symbols')"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
