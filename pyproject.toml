[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kairos-mcp"
version = "0.1.0"
description = "A Microsoft Planner MCP server that writes tasks: create tasks and buckets, list plans and tasks, complete tasks. Delegated device-code auth, Tasks.ReadWrite only."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "800 Pound Gorilla Inc.", email = "james@bigassmonkey.com" }]
keywords = ["mcp", "model-context-protocol", "microsoft-365", "planner", "tasks", "msal", "graph"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Scheduling",
]
dependencies = ["mcp>=1.2.0,<2", "msal>=1.28.0", "requests>=2.31.0"]

[project.urls]
Homepage = "https://github.com/SuperAngryMonkey/kairos"
Source = "https://github.com/SuperAngryMonkey/kairos"
Issues = "https://github.com/SuperAngryMonkey/kairos/issues"

[project.scripts]
kairos-mcp = "server:main"

[tool.hatch.build.targets.wheel]
only-include = ["server.py"]
sources = ["."]

[tool.hatch.build.targets.sdist]
include = ["server.py", "README.md", "LICENSE", "SECURITY.md", "CHANGELOG.md", "pyproject.toml"]
